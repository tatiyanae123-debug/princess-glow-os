name: Glow OS CI

on:
  pull_request:
    branches: [main, feat/glow-os-completion-sprint]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-only-not-a-production-secret-1234567890
      NEXTAUTH_SECRET: ci-only-not-a-production-secret-1234567890
      PRINCESS_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      PRINCESS_GOOGLE_CLIENT_SECRET: ci-placeholder
      DATABASE_URL: postgresql://ci:ci@localhost:5432/glow_os_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
